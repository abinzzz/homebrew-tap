name: bottle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bottle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tap
        run: |
          brew tap abinzzz/tap
          cp Formula/emberloop.rb "$(brew --repository abinzzz/tap)/Formula/emberloop.rb"
      - name: Build and test
        run: |
          brew install --build-bottle abinzzz/tap/emberloop
          brew test abinzzz/tap/emberloop
          brew bottle --json --no-rebuild --root-url=https://github.com/abinzzz/homebrew-tap/releases/download/emberloop-0.2.0 abinzzz/tap/emberloop
      - name: Publish bottle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in *--*.bottle.tar.gz; do mv "$file" "${file/--/-}"; done
          gh release create emberloop-0.2.0 --title 'emberloop 0.2.0 bottles' --notes 'Homebrew prebuilt package.' *.bottle.tar.gz *.bottle.json
      - uses: actions/upload-artifact@v4
        with:
          name: bottle
          path: |
            *.bottle.tar.gz
            *.bottle.json
